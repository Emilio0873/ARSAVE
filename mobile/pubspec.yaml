name: arsave_mobile
description: ARSAVE — sauvegarde et restauration sécurisées de fichiers Android.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.11.3

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  dio: ^5.8.0+1
  flutter_secure_storage: ^9.2.4
  file_picker: ^10.1.2
  path_provider: ^2.1.5
  path: ^1.9.1
  cryptography: ^2.7.0
  provider: ^6.1.5
  shared_preferences: ^2.5.3
  uuid: ^4.5.1
  intl: ^0.20.2
  crypto: ^3.0.6
  google_fonts: ^8.2.1
  fl_chart: ^1.2.0
  file_saver: ^0.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/logo.png
