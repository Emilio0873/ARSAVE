<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>arsave — Télécharger</title>
  <style>
    :root {
      --ink: #e8eef8;
      --muted: #9aa8c7;
      --accent: #3b82f6;
      --green: #a3e635;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      font-family: "Segoe UI", system-ui, sans-serif;
      color: var(--ink);
      background:
        radial-gradient(circle at 20% 20%, rgba(59,130,246,.25), transparent 40%),
        radial-gradient(circle at 80% 0%, rgba(163,230,53,.12), transparent 35%),
        linear-gradient(160deg, #050914, #0b1224 50%, #0e1a36);
    }
    main {
      max-width: 640px;
      margin: 0 auto;
      padding: 40px 20px 64px;
      text-align: center;
    }
    .logo {
      width: min(280px, 80vw);
      height: auto;
      border-radius: 28px;
      box-shadow: 0 18px 50px rgba(0,0,0,.35);
    }
    h1 {
      font-size: clamp(1.6rem, 4vw, 2.2rem);
      margin: 28px 0 10px;
      letter-spacing: -0.03em;
    }
    h1 span.ar { color: var(--green); }
    p { color: var(--muted); line-height: 1.55; margin: 0 auto; max-width: 34rem; }
    .card {
      margin-top: 28px;
      background: rgba(18, 28, 51, 0.92);
      border: 1px solid #243352;
      border-radius: 20px;
      padding: 24px;
      text-align: left;
    }
    .actions {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      margin-top: 20px;
      justify-content: center;
    }
    a.btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      text-decoration: none;
      border-radius: 14px;
      padding: 14px 20px;
      font-weight: 700;
      background: var(--accent);
      color: #fff;
    }
    .note {
      margin-top: 16px;
      font-size: 0.92rem;
      text-align: center;
    }
  </style>
</head>
<body>
  <main>
    <img class="logo" src="./logo.png" alt="arsave" />
    <h1><span class="ar">ar</span>save</h1>
    <p>Sauvegarde et restauration sécurisées de vos fichiers.</p>
    <section class="card">
      <h2 style="margin-top:0; text-align:center">Télécharger l’application</h2>
      <p style="text-align:center">Installez l’application sur Android, puis connectez-vous avec votre compte.</p>
      <div class="actions">
        <a class="btn" id="apkLink" href="./arsave.apk" download>Télécharger pour Android</a>
      </div>
      <p class="note" id="apkHint">Le fichier d’installation sera disponible ici dès sa publication.</p>
    </section>
  </main>
  <script>
    fetch("./arsave.apk", { method: "HEAD" }).then(function (r) {
      if (r.ok) {
        document.getElementById("apkHint").textContent =
          "Téléchargement prêt. Sur Android, autorisez l’installation si demandé.";
      }
    }).catch(function () {});
  </script>
</body>
</html>
